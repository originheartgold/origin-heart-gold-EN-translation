<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Origin HG Save Editor</title>
  <meta name="description" content="Edit party, abilities, moves, stats and bag in Pokémon Origin HeartGold v4.0.3 save files. Runs entirely in your browser.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    try {
      const saved = localStorage.getItem('ohg-editor-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.75 10h5.5M12.75 10h5.5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Origin HG</span><span class="brand-sub">save editor</span>
    </div>
    <div class="views seg" role="group" aria-label="Editor view" id="view-switch" hidden>
      <button type="button" data-view="pokemon" aria-pressed="true">Party</button>
      <button type="button" data-view="pc" aria-pressed="false">PC</button>
      <button type="button" data-view="trainer" aria-pressed="false">Trainer</button>
      <button type="button" data-view="bag" aria-pressed="false">Bag</button>
    </div>
    <div class="file-meta" id="file-meta" hidden></div>
    <div class="bar-actions">
      <button type="button" class="btn ghost" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg></button>
      <button type="button" class="btn ghost desktop-only" id="undo" disabled title="Undo (⌘Z)">Undo</button>
      <label class="btn" for="file-input">Open<span class="desktop-only">&nbsp;save</span></label>
      <input type="file" id="file-input" accept=".sav,.dsv,application/octet-stream" hidden>
      <button type="button" class="btn primary desktop-only" id="export" disabled>Export</button>
    </div>
  </header>

  <main id="app">
    <section class="drop" id="drop">
      <div class="drop-inner">
        <p class="drop-title">Drop your <code>.sav</code> or <code>.dsv</code> here</p>
        <p class="drop-sub">English Origin HeartGold v4.0.3. The file never leaves this tab.</p>
        <label class="btn primary" for="file-input">Choose file</label>
      </div>
    </section>
  </main>

  <nav class="dock" id="dock" aria-label="Editor" hidden>
    <button type="button" data-view="pokemon" aria-pressed="true">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.75 10h4.5M12.75 10h4.5" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Party</span>
    </button>
    <button type="button" data-view="pc" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 13v4M6 17h8" stroke="currentColor" stroke-width="1.5"/></svg><span>PC</span>
    </button>
    <button type="button" data-view="trainer" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7.75" cy="9" r="1.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 13.25c.5-1.3 1.5-2 2.75-2s2.25.7 2.75 2M12 8.5h3M12 11.25h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Trainer</span>
    </button>
    <button type="button" data-view="bag" aria-pressed="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 7.25h11l-.8 8.6a1 1 0 0 1-1 .9H6.3a1 1 0 0 1-1-.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.25 7.25V6a2.75 2.75 0 0 1 5.5 0v1.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>Bag</span>
    </button>
    <span class="dock-sep" aria-hidden="true"></span>
    <button type="button" id="dock-undo" disabled aria-label="Undo">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 4 8.5 7.5 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 8.5h7a4 4 0 0 1 0 8H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Undo</span>
    </button>
    <button type="button" id="dock-export" class="dock-primary">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v9M6.5 9 10 12.5 13.5 9M4 15.5h12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Export</span>
    </button>
  </nav>

  <dialog class="sheet" id="add-dialog" aria-labelledby="add-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="dist/ui/app.js"></script>
</body>
</html>
