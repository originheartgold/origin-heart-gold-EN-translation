notes = "All screens: NewMsgDataFromNarc at 0x0200BA98 stores type 1 whatever the caller asked: 'adds r5, r0, #0' -> 'movs r5, #1' at 0x0200BA9A. Every text bank is read line by line; none is loaded whole into a screen heap any more (149 call sites in rc3). Every MsgData function handles both types, and nothing outside them reads a loaded bank. The msgload-summary/bag patches are kept as a second layer."
