id = "gfx-pokeathlon"
title = "Pokéathlon SWITCH buttons and instruction screens"
kind = "graphics"
enabled = true
decisions = ["D-0768", "D-1106", "D-1041"]
requires = []
why = """
Players: the Pokéathlon SWITCH button says 交换, and the event instruction screens show the Japanese art
(こうたい, まい, ポケスロン, Japanese player names, POKETHLON).

Technical: the SWITCH label tiles are in a/1/7/8 #17, a/2/3/2 #8 and a/2/4/0 #16 (the last two LZ11). The
hack is built on the Japanese ROM, so a/2/1/9 #12-21, #44, #45, #48-51 are the Japanese members where the USA
ROM has English.
"""
what = """
Old: 交换 and Japanese instruction art.
New: only the SWITCH label tiles are copied from the USA members (the hack's other edits in a/1/7/8 #17
stay); the instruction screens are the USA members (SWITCH, Pcs., YOU / Eoin / Aven / Shania, POKéATHLON).
"""
evidence = [
  "work/notes/graphics_inventory.md: rows 19 and 30 (pass3_pokeathlon.png)",
  "Runtime: emu_harness.py fixes --case gfx-pokeathlon (scenario pokeathlon: crop pokeathlon-label, Pokeathlon instruction screen (Hurdle Dash): the POKeATHLON label; pending the user's approval of the crop; each run on the build and on one without this fix, work/notes/emu_harness.md 'Fix scenarios')",
]

