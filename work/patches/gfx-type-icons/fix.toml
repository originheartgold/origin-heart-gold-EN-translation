id = "gfx-type-icons"
title = "Type and contest icons (USA art; FAIRY from hg-engine)"
kind = "graphics"
enabled = true
decisions = ["D-0768", "D-1041"]
requires = []
why = """
Players: the type icons on the battle move menu, the summary moves page and the move relearner, and the
contest-type icons, show Chinese characters (火, 水 ...); the hack's Fairy type shows 妖.

Technical: a/0/0/8 #219-241 (LZ10 NCGR, 32x16) are the hack's redrawn icons. The hack's type 9 (FAIRY,
hg-engine TYPE_FAIRY) uses the vanilla ??? slot #236.
"""
what = """
Old: Chinese type and contest icons.
New: #219-235 and #237-241 are the USA members (palette #74 unchanged). #236 keeps the hack's container and
pink palette row (#74 row 2, idx 10-12) and takes the tiles of hg-engine's FAIRY icon.
"""
evidence = [
  "work/notes/graphics_inventory.md: rows 1-2",
  "work/graphics/CREDITS.md: hg-engine source, commit and licence",
  "CHANGELOG.md v1.0.0: 'English type icons for battle, the summary screen and the move relearner. The FAIRY icon comes from hg-engine.'",
  "Runtime: emu_harness.py fixes --case gfx-type-icons (scenario ivev: the summary type icon crop differs from the Chinese ROM's; each run on the build and on one without this fix, work/notes/emu_harness.md 'Fix scenarios')",
]

