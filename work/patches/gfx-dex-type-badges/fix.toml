id = "gfx-dex-type-badges"
title = "Pokédex type badges and the type-label sheet"
kind = "graphics"
enabled = true
decisions = ["D-0768", "D-1041", "D-1110"]
requires = []
why = """
Players: the Pokédex search and type pages show Chinese type badges (the FAIRY badge says 妖), and the
entry/registration page after a catch shows Chinese type labels (the reported 普通).

Technical: a/0/6/8 #36-52 are the Pokédex type badges (48x16), #123 is the hack-added FAIRY badge, and #131 is
a hack-added 4x40-tile sheet of 18 coloured 32x16 labels (palette #130). The costume copies
data/clothes1/a068.narc and data/clothes2/a068.narc hold the same members.
"""
what = """
Old: Chinese badges and labels.
New: #36-52 are the USA members; #123 takes hg-engine's dex_gfx 8_123 tiles; #131 is built from
dex_type_list_en.png (gfx.py make-dex-type-list: the USA battle type-icon letters recoloured with the hack's
label colours, FAIRY letters from hg-engine; a composed graphic kept by D-1110). Each change also goes into
both costume copies.
"""
evidence = [
  "work/notes/graphics_inventory.md: rows 4-6 and 'Assets generated in this project'",
  "work/graphics/CREDITS.md",
  "CHANGELOG.md v1.0.0: 'Pokédex type badges, header and buttons ...'",
]

