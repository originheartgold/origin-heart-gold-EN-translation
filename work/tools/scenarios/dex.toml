id = "dex"
description = "Pokedex entry panels 1-30 (number read back by OCR) unchanged from the approved baseline of each ROM"
refs = []
steps = [
  { op = "dexcapture", observe = "dex", first = 1, last = 30 },
]

[start]
save = "full_bag_6mons.sav"
clock = "2026-10-09T12:00:00"

[[expect]]
obs = "dex.errors"
equals = []
note = "every panel showed the dex number it was meant to"

[[expect]]
obs = "dex.captured"
len = 30

[parity.differ."dex.digests"]
why = "the panels show Chinese and English text"
cn = { baseline = true, note = "panel digests equal the approved run's (delete the baseline file to re-approve)" }
en = { baseline = true, note = "panel digests equal the approved run's (delete the baseline file to re-approve)" }
